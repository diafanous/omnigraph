# Weekly: merge new ModernRelay/omnigraph commits on a branch, run the
# security audit (personal/sync/audit.py), and open a pull request.
# You approve an update by merging that pull request. See personal/SYNC.md.
name: personal-upstream-sync

on:
  schedule:
    - cron: "17 13 * * 1" # Mondays 13:17 UTC (08:17 or 09:17 New York)
  workflow_dispatch:
    inputs:
      audit_only_base:
        description: "Optional: audit BASE..upstream/main only (a tag or sha), no merge or PR"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: personal-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    # Never runs in the upstream repository.
    if: github.repository_owner != 'ModernRelay'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out the fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Install pinned audit tools (checksums verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          deny="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSLo deny.tgz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${deny}.tar.gz"
          echo "${CARGO_DENY_SHA256}  deny.tgz" | sha256sum -c -
          tar xzf deny.tgz && install -m 0755 "${deny}/cargo-deny" bin/cargo-deny
          curl -fsSLo gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && install -m 0755 gitleaks bin/gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Audit a past range only (manual test)
        if: ${{ inputs.audit_only_base }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.audit_only_base }}
        run: |
          git remote add upstream https://github.com/ModernRelay/omnigraph.git
          git fetch --quiet --tags upstream main
          cp -r personal/sync "$RUNNER_TEMP/sync"
          git checkout --quiet --detach upstream/main
          python3 "$RUNNER_TEMP/sync/audit.py" --base "$BASE" --head upstream/main \
            --worktree . --out "$RUNNER_TEMP/audit" || true
          cat "$RUNNER_TEMP/audit/audit.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Merge, audit and open the pull request
        if: ${{ !inputs.audit_only_base }}
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
          AUTO_MERGE_ON_PASS: ${{ vars.AUTO_MERGE_ON_PASS }}
        run: |
          # Copy the sync code out of the tree first: the merge must not be able
          # to change the code that audits it.
          cp -r personal/sync "$RUNNER_TEMP/sync"
          python3 "$RUNNER_TEMP/sync/sync.py" --out "$RUNNER_TEMP/audit"

      - name: Keep the audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-sync-audit
          path: ${{ runner.temp }}/audit
          if-no-files-found: ignore
